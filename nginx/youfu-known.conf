# /etc/nginx/sites-available/youfu-known
# Nginx reverse proxy for youfu-known (KB SPA + admin SPA).
#
# Topology on the Pi (loopback-only):
#
#     cloudflared
#        |  (host = kb.sxy.homes)         (host = admin.sxy.homes)
#        v                                v
#     127.0.0.1:8001                  127.0.0.1:8002   <-- this file
#        |                                |
#        |  (passes everything through)   |   /api/* -> 8000   (FastAPI)
#        |                                |   else      -> 5174 (admin-web)
#        v                                v
#     127.0.0.1:8000                  127.0.0.1:5174
#     (FastAPI / uvicorn)             (admin-web/dist via http.server)
#
# Why nginx?
#   - The admin SPA lives on its own origin (different port +
#     different process). Browsers will not send cookies across origins
#     unless CORS is configured AND ``Domain=.sxy.homes`` is set on the
#     session cookie. Both are true; nginx just routes the bytes.
#   - Lets cloudflared ingress hit one daemon per hostname and keeps
#     5174 / 8000 bound to 127.0.0.1 (no public exposure).
#
# Install on the Pi (see scripts/install_nginx_pi.sh):
#   sudo apt install -y nginx
#   sudo cp nginx/youfu-known.conf /etc/nginx/sites-available/youfu-known.conf
#   sudo ln -s /etc/nginx/sites-available/youfu-known.conf /etc/nginx/sites-enabled/youfu-known.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -I http://127.0.0.1:8001/api/health   # -> 200 from FastAPI
#   curl -I http://127.0.0.1:8002/             # -> 200 from admin-web
#   curl -I http://127.0.0.1:8002/api/health   # -> 200 from FastAPI (proxied)

# Upstream pools
upstream youfu_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream admin_web {
    server 127.0.0.1:5174;
    keepalive 4;
}

# --- KB SPA + API: single origin, everything forwarded to FastAPI ---
#
# ``kb.sxy.homes`` is served by the same backend process that runs the
# API (cookies, no CORS needed, SPA routes fall through to FastAPI's
# ``/`` and ``/{full_path:path}`` handlers).
server {
    listen 127.0.0.1:8001;
    server_name _;

    # Generous body size for KB document uploads (matches FastAPI
    # upload limits; tune to your taste).
    client_max_body_size 200m;

    location / {
        proxy_pass http://youfu_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- admin.sxy.homes: split SPA (static) + API (FastAPI) ---
#
# The admin SPA is reached by the user's browser at
# ``https://admin.sxy.homes``. nginx splits traffic:
#
#   * ``/api/...`` -> FastAPI :8000 (so the SPA can fetch with
#     credentials; cookies flow because the cookie is scoped to
#     ``.sxy.homes`` and CORS allows ``https://admin.sxy.homes``).
#   * everything else -> ``admin-web/dist`` :5174 (a tiny
#     ``python -m http.server``).
#
# We use a ``server_name`` match on this block too so the cloudflared
# ingress rule ``hostname: admin.sxy.homes -> 8002`` lands here
# unambiguously.
server {
    listen 127.0.0.1:8002;
    server_name admin.sxy.homes;

    client_max_body_size 50m;

    # FastAPI: every ``/api/*`` path is proxied upstream. Note we do
    # NOT strip ``/api`` -- the backend already expects ``/api/...``
    # routes (FastAPI mounts routers under ``/api/``).
    location /api/ {
        proxy_pass http://youfu_api;
        proxy_http_version 1.1;
        proxy_set_header Host              admin.sxy.homes;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA bundle: ``admin-web/dist`` served by ``python -m http.server``
    # on port 5174. nginx is the TLS-terminating front; cloudflared
    # already terminates TLS upstream.
    location / {
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}